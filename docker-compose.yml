name: semelpass-oss
services:
  caddy:
    image: caddy:2-alpine
    container_name: semelpass-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy-net
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semelpass-backend
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy-net
      - data-net
      - mail-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  postgres:
    image: postgres:16-alpine
    container_name: semelpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: semelpass-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  postfix:
    build: ./postfix
    image: semelpass-postfix
    container_name: semelpass-postfix
    restart: unless-stopped
    environment:
      - HOSTNAME=mail.semelpass.com
      - ALLOWED_SENDER_DOMAINS=semelpass.com
      - DKIM_AUTOGENERATE=1
    volumes:
      - postfix_dkim:/etc/opendkim/keys
    networks:
      - mail-net
    healthcheck:
      test: ["CMD-SHELL", "postfix status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  juiceshop:
    image: bkimminich/juice-shop
    container_name: semelpass-juiceshop
    restart: unless-stopped
    networks:
      - proxy-net
  # Frontend Builder
  # Usage: docker compose --profile build run --rm frontend-builder
  frontend-builder:
    image: node:20-alpine
    profiles: ["build"]
    container_name: semelpass-frontend-builder
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./caddy/static:/static
    command: sh -c "npm install && npm run build"
networks:
  proxy-net:
    name: semelpass-proxy
    driver: bridge
  data-net:
    name: semelpass-data
    driver: bridge
    internal: true
  mail-net:
    name: semelpass-mail
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  postfix_dkim:
  caddy_data:
  caddy_config:
